# ia-chat · a bateria inteira, em toda mudança.
#
# ─── POR QUE macOS, e não Ubuntu (que é mais rápido e mais barato) ────────────
# O produto é feito para o Mac e a bateria mede isso: `teste_server_connection.py`
# lê `pmset -g batt` e `ipconfig getifaddr en0`; o repo irmão fatia `.icns` com
# `sips`/`iconutil`, lê `Info.plist` com `plutil` e procura o `lsof` em
# `/usr/sbin` (no Linux ele mora em `/usr/bin`, quando existe). Num runner Ubuntu
# esses testes não passariam a valer — eles falhariam por ausência de ferramenta,
# ou pior, se declarariam não-aplicáveis e o verde diria algo que ninguém mediu.
#
# E há o argumento que decide sozinho: `teste_python_sistema.py` existe para
# provar que o produto roda no `/usr/bin/python3` do Mac. Esse arquivo NÃO EXISTE
# no Linux — o teste se declara ⊘ e a promessa central do projeto atravessa o CI
# sem ser testada. Um CI que não testa a promessa é um selo, não um gate.
#
# Custo: minutos de macOS valem 10× em repositório privado. Em repositório
# PÚBLICO, os runners padrão do GitHub são gratuitos — e estes dois repos vão ser
# públicos. Se algum dia forem fechados, esta linha vira uma decisão de dinheiro
# e tem de ser revista aqui, com o número na mão.
name: testes

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Sem caminho de máquina em lugar nenhum: o dono vem do contexto do evento (em
  # `pull_request` o GitHub usa o repositório BASE, então PR de fork também acerta).
  # O nome do irmão é convenção do projeto — a mesma que o `instalar-app.sh` usa
  # quando deriva um repo do outro.
  REPO_IRMAO: ${{ github.repository_owner }}/ia-chat-app

jobs:
  bateria:
    name: bateria · python ${{ matrix.interpretador }}
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # DUAS pernas, e cada uma cobre o que a outra não cobre:
        #  · `sistema`  — o `/usr/bin/python3` do Mac (3.9.6). É a promessa do
        #    projeto: quem clona não instala nada. `actions/setup-python` NÃO
        #    oferece 3.9 em macOS arm64, então usar o do sistema não é só mais
        #    fiel — é a única forma de testar 3.9 neste runner.
        #  · `moderno`  — o Python de hoje. Pega o contrário: sintaxe e stdlib que
        #    mudam sob os pés (o núcleo já documenta o risco do free-threading).
        interpretador: [sistema, moderno]

    steps:
      - name: este repositório
        uses: actions/checkout@v4
        with:
          path: ia-chat

      # A bateria deste repo lê o repo irmão: `teste_python_sistema.py` e
      # `teste_caminhos_citados.py` cobrem os arquivos de lá. Sem o irmão, os dois
      # simplesmente cobrem menos e continuam verdes — falso verde silencioso. Por
      # isso o clone é obrigatório e a ausência dele FALHA, no passo seguinte.
      # `continue-on-error` para separar dois casos que a falha crua confundia. No
      # PRIMEIRO push deste repo o irmão ainda não foi publicado — e o CI ficava
      # vermelho de saída, que é a primeira coisa que um visitante vê. Vermelho por
      # ordem de publicação não mede qualidade nenhuma; ensina a ignorar o selo.
      - name: o repositório irmão, ao lado
        id: irmao
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_IRMAO }}
          path: ia-chat-app

      # O fail-closed CONTINUA — só passou a saber a diferença entre "ainda não existe"
      # e "existe e não veio". O segundo é defeito real (permissão, nome errado, rede) e
      # segue falhando; o primeiro é o dia da publicação, e vira aviso alto.
      - name: o irmão está mesmo do lado
        run: |
          if [ -f "$GITHUB_WORKSPACE/ia-chat-app/ia-chat.app/Contents/Resources/lancador.py" ]; then
            echo "· irmão presente: $(ls "$GITHUB_WORKSPACE/ia-chat-app" | tr '\n' ' ')"
            exit 0
          fi
          # Existe lá fora? A pergunta é para o GitHub, não para o meu palpite.
          codigo="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/$REPO_IRMAO")"
          if [ "$codigo" = "404" ]; then
            echo "::warning::$REPO_IRMAO ainda não existe. teste_python_sistema.py e teste_caminhos_citados.py cobrem MENOS arquivos nesta rodada — eles se declaram ⊘ em vez de inventar verde. Publique o irmão e rode de novo por workflow_dispatch."
            exit 0
          fi
          echo "::error::$REPO_IRMAO existe (HTTP $codigo) mas não veio para o workspace — permissão, nome ou rede. Sem ele os dois gates cobririam menos e continuariam verdes, e falso verde é pior que vermelho."
          exit 1

      # `teste_despacho_pendurado.py` prova a sessão tmux DE VERDADE: criar um
      # mock aqui faria o gate verificar o próprio teatro. O Mac do operador já
      # tem tmux; a imagem hospedada não. Preparar o runner é parte do teste.
      - name: tmux real para a integração do despacho
        run: |
          if command -v tmux >/dev/null 2>&1; then
            echo "· tmux já presente: $(command -v tmux)"
            tmux -V
            exit 0
          fi
          HOMEBREW_NO_AUTO_UPDATE=1 brew install tmux
          command -v tmux
          tmux -V

      - name: python moderno
        if: matrix.interpretador == 'moderno'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # O valor entra por `env`, não por interpolação dentro do shell: aqui ele é
      # literal da minha própria matriz, mas a regra de nunca costurar expressão
      # em `run:` vale mesmo quando a entrada é confiável — é o hábito que impede
      # o dia em que ela deixa de ser.
      - name: escolher o interpretador e dizer qual é
        env:
          PERNA: ${{ matrix.interpretador }}
        run: |
          if [ "$PERNA" = "sistema" ]; then
            PY=/usr/bin/python3
            if [ ! -x "$PY" ]; then
              echo "::error::$PY não existe neste runner. A promessa 'roda no Python que já vem no Mac' não pode ser testada — falhando alto em vez de trocar de interpretador por baixo do pano."
              exit 1
            fi
          else
            PY="$(command -v python3)"
          fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          echo "· interpretador: $PY"
          "$PY" -VV

      - name: a bateria inteira
        working-directory: ia-chat
        run: |
          set -u
          set -o pipefail
          # `set +e` é DELIBERADO e não é relaxamento. O runner entrega o shell com
          # `-e` ligado; com ele, o primeiro teste vermelho abortaria o laço e o
          # resumo nunca sairia — o CI diria "falhou" sem dizer o quê, e os outros
          # 29 testes ficariam sem resposta. Quem decide o veredito aqui é o
          # contador `falharam`, na última linha, não o primeiro tropeço.
          set +e
          # Sem `nullglob`, um glob sem correspondência sobra literal e o laço
          # "roda" um arquivo chamado `teste_*.py`: o CI reprovaria, sim, mas pelo
          # motivo errado e com a mensagem errada. Com ele, zero é zero.
          shopt -s nullglob
          LOGS="$RUNNER_TEMP/logs"; mkdir -p "$LOGS"
          encontrados=0; executados=0; falharam=0; declarados=0
          linhas=""
          for f in tests/teste_*.py; do
            encontrados=$((encontrados + 1))
            nome="$(basename "$f" .py)"
            if "$PY" "$f" > "$LOGS/$nome.log" 2>&1; then estado="✔"; else
              estado="✗"; falharam=$((falharam + 1)); fi
            executados=$((executados + 1))
            # ⊘ é como um teste desta casa declara "não aplicável neste sistema".
            # O CI não pode deixar isso passar calado: conta, mostra na tabela e
            # avisa. Exclusão declarada é aceitável; exclusão invisível não é.
            na="$(grep -c '⊘' "$LOGS/$nome.log" 2>/dev/null || true)"
            # `if` e não `[ ... ] && ...`: uma lista `&&` que termina em falso é
            # comando falho, e num shell com `-e` isso mata o laço no primeiro
            # teste. A forma explícita não tem esse gume.
            if [ -z "$na" ]; then na=0; fi
            declarados=$((declarados + na))
            printf '  %s %-34s ⊘%s\n' "$estado" "$nome" "$na"
            linhas="$linhas| \`$nome\` | $estado | $na |"$'\n'
            if [ "$estado" = "✗" ]; then
              echo "::group::✗ $nome"; cat "$LOGS/$nome.log"; echo "::endgroup::"
            fi
          done

          {
            echo "## bateria · \`$PY\`"
            echo
            echo "| teste | resultado | ⊘ declarados |"
            echo "|---|---|---|"
            printf '%s' "$linhas"
            echo
            echo "**$encontrados encontrados · $executados executados · $falharam vermelhos · $declarados não-aplicáveis declarados**"
          } >> "$GITHUB_STEP_SUMMARY"

          # Um CI que roda zero teste e diz "passing" é a mentira mais barata que
          # existe. Se o glob não achar nada — pasta renomeada, checkout no lugar
          # errado —, isto é vermelho, não verde.
          if [ "$encontrados" -eq 0 ]; then
            echo "::error::nenhum tests/teste_*.py encontrado. Um verde aqui seria mentira."
            exit 1
          fi
          if [ "$executados" -ne "$encontrados" ]; then
            echo "::error::$encontrados encontrados e só $executados executados."
            exit 1
          fi
          if [ "$declarados" -gt 0 ]; then
            echo "::warning::$declarados verificação(ões) se declararam não-aplicáveis neste runner — veja a tabela do resumo e os logs."
          fi
          echo "· $encontrados testes · $falharam vermelhos · $declarados ⊘"
          [ "$falharam" -eq 0 ]
          exit $?

      # Um vermelho aqui precisa ser diagnosticável sem repetir a corrida — e
      # `teste_fronteira_sala.py` roda a bateria DENTRO dele, o que o deixa
      # exposto a intermitência (medido: 1 falha em 3 baterias locais). Guardar o
      # log de cada teste é o que separa "deu ruim" de "deu ruim aqui, nesta linha".
      - name: guardar os logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.interpretador }}
          path: ${{ runner.temp }}/logs
          retention-days: 14
